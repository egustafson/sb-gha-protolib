[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sb-gha-protolib"
version = "0.3.1"
description = "Prototype greeting library and CLI example for GitHub Actions workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
	"build>=1.2.0",
	"pytest>=9.0.3",
	"ruff>=0.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["greet", "main"]
